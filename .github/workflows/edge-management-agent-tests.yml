name: Edge Management Agent tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  edge-management-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Verify management agent safety helpers
        run: |
          python - <<'PY'
          import edge_management_agent as agent

          result = agent.list_files()
          assert result["ok"] is True

          try:
              agent._safe_path("../outside.txt")
          except ValueError:
              pass
          else:
              raise AssertionError("Path traversal was accepted")

          print("EDGE MANAGEMENT AGENT SAFETY TEST OK")
          PY
